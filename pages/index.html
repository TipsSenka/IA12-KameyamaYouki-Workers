<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>今日の学びを、軽やかに。</title>
<style>
  :root{
    --paper:#F7F5EF;
    --rule:#D9D3C4;
    --ink:#22303A;
    --teal:#2F6F63;
    --teal-dark:#20504A;
    --sand:#E7DCC3;
    --muted:#8A8478;
    --error:#B4472B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 35px,
        var(--rule) 35px,
        var(--rule) 36px
      ),
      var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink);
    padding:0 0 80px;
  }
  header{
    padding:56px 32px 32px;
    max-width:920px;
    margin:0 auto;
  }
  .eyebrow{
    font-size:13px;
    color:var(--teal-dark);
    letter-spacing:.04em;
    margin-bottom:14px;
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:44px;
    line-height:1.4;
    margin:0 0 12px;
    font-weight:600;
  }
  .lede{
    font-size:15px;
    color:var(--muted);
    line-height:1.8;
    max-width:32em;
  }
  .console{
    max-width:920px;
    margin:0 auto 40px;
    padding:0 32px;
  }
  .worker-bar{
    display:flex;
    gap:10px;
    background:#fff;
    border:1px solid var(--rule);
    padding:14px;
    border-radius:4px;
  }
  .worker-bar label{
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-bottom:6px;
  }
  .worker-bar .field{flex:1;}
  .worker-bar input[type=text]{
    width:100%;
    border:1px solid var(--rule);
    padding:9px 10px;
    font-size:14px;
    border-radius:3px;
    font-family:inherit;
    background:#FCFBF8;
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .save-btn{
    align-self:flex-end;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:0 20px;
    border-radius:3px;
    font-size:13px;
    height:40px;
    margin-top:auto;
  }
  .save-btn:hover{background:var(--teal-dark);}
  .status-line{
    font-size:12px;
    color:var(--muted);
    margin:10px 2px 0;
  }
  .status-line.ok{color:var(--teal-dark);}
  .status-line.bad{color:var(--error);}
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:28px;
  }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }
  .card{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:20px;
  }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }
  .card-head h2{
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  .card-head .route{
    font-size:11px;
    color:var(--muted);
  }
  .name-input{
    width:100%;
    border:1px solid var(--rule);
    padding:8px 10px;
    font-size:14px;
    border-radius:3px;
    margin-bottom:10px;
    font-family:inherit;
  }
  .run-btn{
    width:100%;
    background:var(--sand);
    color:var(--teal-dark);
    border:1px solid var(--rule);
    padding:10px;
    border-radius:3px;
    font-size:14px;
    font-weight:600;
    transition:background .15s;
  }
  .run-btn:hover{background:#DECFA6;}
  .run-btn:disabled{opacity:.5;cursor:default;}
  .result{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
    min-height:20px;
  }
  .result.filled{color:var(--ink);}
  .result.error{color:var(--error);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">CLOUDFLARE WORKERS / API CONSOLE</div>
  <h1>今日の学びを、<br>軽やかに。</h1>
  <p class="lede">Pagesから Worker へ接続し、4つの API をひとつの画面で確認できます。</p>
</header>

<div class="console">
  <div class="worker-bar">
    <div class="field">
      <label for="workerUrl">Worker URL</label>
      <input type="text" id="workerUrl" placeholder="http://127.0.0.1:8787" value="http://127.0.0.1:8787">
    </div>
    <button class="save-btn" onclick="saveUrl()">接続先を保存</button>
  </div>
  <div class="status-line" id="statusLine">接続先を確認してください。</div>

  <div class="grid">

    <div class="card">
      <div class="card-head">
        <h2>コース</h2>
        <span class="route">GET /api/course</span>
      </div>
      <button class="run-btn" onclick="callApi('course')">コースを取得</button>
      <div class="result" id="result-course">まだ取得していません。</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>メッセージ</h2>
        <span class="route">GET /api/hello</span>
      </div>
      <input type="text" class="name-input" id="nameInput" placeholder="名前を入力">
      <button class="run-btn" onclick="callApi('hello')">挨拶する</button>
      <div class="result" id="result-hello">名前を入力して実行してください。</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>今日の運勢</h2>
        <span class="route">GET /api/fortune</span>
      </div>
      <button class="run-btn" onclick="callApi('fortune')">運勢を見る</button>
      <div class="result" id="result-fortune">まだ取得していません。</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>イベント</h2>
        <span class="route">GET /api/events</span>
      </div>
      <button class="run-btn" onclick="callApi('events')">イベントを取得</button>
      <div class="result" id="result-events">まだ取得していません。</div>
    </div>

  </div>
</div>

<script>
let workerUrl = document.getElementById('workerUrl').value.trim();

function saveUrl(){
  workerUrl = document.getElementById('workerUrl').value.trim();
  const status = document.getElementById('statusLine');
  if(!workerUrl){
    status.textContent = 'Worker URL を入力してください。';
    status.className = 'status-line bad';
    return;
  }
  status.textContent = '接続先を保存しました: ' + workerUrl;
  status.className = 'status-line ok';
}

async function callApi(kind){
  const resultEl = document.getElementById('result-' + kind);
  const btn = event.target;
  btn.disabled = true;
  resultEl.className = 'result';
  resultEl.textContent = '取得中…';

  let path = '/api/' + kind;
  if(kind === 'hello'){
    const name = document.getElementById('nameInput').value.trim();
    if(!name){
      resultEl.textContent = '名前を入力して実行してください。';
      btn.disabled = false;
      return;
    }
    path += '?name=' + encodeURIComponent(name);
  }

  try{
    const res = await fetch(workerUrl + path);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json().catch(async () => await res.text());
    resultEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    resultEl.classList.add('filled');
  }catch(err){
    resultEl.textContent = '取得に失敗しました: ' + err.message + '\n(Worker URL と CORS 設定を確認してください)';
    resultEl.classList.add('error');
  }finally{
    btn.disabled = false;
  }
}
</script>

</body>
</html>
